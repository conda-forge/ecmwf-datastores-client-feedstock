{% set name = "ecmwf-datastores-client" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ecmwf_datastores_client-{{ version }}.tar.gz
  sha256: 2a82791682e63dbee4db3b736d9b399dea5766a4573181fdd0eb0343124e5972

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - attrs >=23.1.0
    - multiurl >=0.3.7
    - requests >=2.5.0
    - typing_extensions >=4.13.0

test:
  imports:
    - ecmwf.datastores
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/ecmwf/ecmwf-datastores-client
  summary: ECMWF Data Stores Service (DSS) API Python client
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - malmans2
    - jameshawkes
    - EddyCMWF
